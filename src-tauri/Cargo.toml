[package]
name = "formmorpheus"
version = "0.19.0"
description = "formmorpheus desktop shell"
authors = ["nodemode-ai"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
regex = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# The desktop's recent-documents list (note_recent_document): GTK's RecentManager, the crate Tauri's window layer already builds.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Record sound: the web view's media stream setting and its microphone permission request (the crate Tauri's window layer already builds).
webkit2gtk = "2.0"

# Windows: SHAddToRecentDocs for the taskbar jump list.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDocumentController", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "objc2-core-foundation", "NSColor"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSGeometry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = false

[profile.release.build-override]
strip = false
