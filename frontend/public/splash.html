<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>formmorpheus</title>
  <style>
    html { height: 100%; background: transparent; }
    body { margin: 0; height: 100%; box-sizing: border-box; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 16px; overflow: hidden; color: #a8a8b8; font: 13px -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: calc(50vh - 64px); gap: 18px; }
    svg { display: block; }
    p { margin: 0; height: 16px; line-height: 16px; letter-spacing: 0.2px; }
    .bar { width: 180px; height: 3px; border-radius: 2px; background: #1f1f26; overflow: hidden; }
    .fill { width: 100%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #3A7BFF, #9A5CFF 30%, #FF4F7A 62%, #FFAE2B); transform-origin: 0 50%; transform: scaleX(0.04); animation: load 2.6s cubic-bezier(0.25, 0.6, 0.35, 1) forwards; }
    .fill.done { animation: none; transform: scaleX(1); transition: transform 0.2s ease-out; }
    @keyframes load { to { transform: scaleX(0.92); } }
  </style>
</head>
<body><svg width="72" height="72" role="img" aria-label="formmorpheus" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="fm-tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32"><stop offset="0" stop-color="#1C1C22"/><stop offset="1" stop-color="#0A0A0D"/></linearGradient><linearGradient id="fm-rim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.03"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.07"/></linearGradient><radialGradient id="fm-bloom" gradientUnits="userSpaceOnUse" cx="16" cy="16" r="14"><stop offset="0" stop-color="#9A5CFF" stop-opacity="0.18"/><stop offset="1" stop-color="#9A5CFF" stop-opacity="0"/></radialGradient><linearGradient id="fm-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A7BFF"/><stop offset="1" stop-color="#5B8DFF"/></linearGradient><linearGradient id="fm-b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9A5CFF"/><stop offset="1" stop-color="#FF4F7A"/></linearGradient><linearGradient id="fm-c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6A5C"/><stop offset="0.5" stop-color="#FFAE2B"/><stop offset="1" stop-color="#FFC24D"/></linearGradient></defs><rect width="32" height="32" rx="7" ry="7" fill="url(#fm-tile)"/><rect width="32" height="32" rx="7" ry="7" fill="url(#fm-bloom)"/><circle cx="10" cy="21.5" r="6.6" fill="url(#fm-a)" fill-opacity="0.92"/><rect x="9.2" y="9.7" width="13.2" height="13.2" rx="5.4" fill="url(#fm-b)" stroke="#0E0E12" stroke-width="0.9"/><rect x="15.4" y="4.4" width="12.2" height="12.2" rx="2" fill="url(#fm-c)" stroke="#0E0E12" stroke-width="0.9"/><rect x="0.2" y="0.2" width="31.6" height="31.6" rx="6.8" ry="6.8" fill="none" stroke="url(#fm-rim)" stroke-width=".4"/></svg><p>Starting formmorpheus</p><div class="bar"><div class="fill"></div></div><script>
window.formmorpheusSplashDone = function () {
  var fill = document.querySelector('.fill');
  fill.style.transform = getComputedStyle(fill).transform;
  fill.classList.add('done');
  requestAnimationFrame(function () { fill.style.transform = ''; });
};
</script></body>
</html>
